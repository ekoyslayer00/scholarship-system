<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><title>Scholar Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head><body hidden>
<header class="bar">
  <span>Scholar Dashboard</span>
  <button id="logout">Sign out</button>
</header>
<main class="grid">
  <section class="card">
    <h2>Submit Semester Summary</h2>
    <form id="submit-form">
      <label>Academic Year <input id="ay" required placeholder="2025-2026"></label>
      <label>Semester
        <select id="sem" required>
          <option value="1st">1st</option>
          <option value="2nd">2nd</option>
          <option value="Summer">Summer</option>
        </select>
      </label>
      <label>GWA <input type="number" step="0.01" min="1" max="5" id="gwa" required></label>
      <label>Enrolled Units <input type="number" min="0" id="units" required></label>
      <label>Failed <input type="number" min="0" id="failed" value="0" required></label>
      <label>Incomplete <input type="number" min="0" id="incomplete" value="0" required></label>
      <label>Dropped <input type="number" min="0" id="dropped" value="0" required></label>
      <label>Grade-Document Reference (URL / Drive ID) <input id="evidence" required></label>
      <button type="submit">Submit</button>
    </form>
    <p id="msg" class="msg"></p>
  </section>

  <section class="card">
    <h2>My Submissions</h2>
    <table id="subs">
      <thead><tr>
        <th>AY</th><th>Sem</th><th>GWA</th><th>Verification</th>
        <th>Compliance</th><th>Award</th><th>Submitted</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script type="module" src="js/scholar.js"></script>
</body></html>
